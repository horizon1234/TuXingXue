<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">从三维场景到二维图像的渲染流程</title>
  <desc id="desc">三维场景经过渲染器计算，再由 PutPixel 写入二维画布。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="#f8fafc"/>
  <rect x="55" y="70" width="250" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="180" y="125" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#0c4a6e">三维场景</text>
  <text x="180" y="170" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">物体 · 光源 · 相机</text>

  <line x1="305" y1="145" x2="425" y2="145" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="435" y="70" width="330" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#78350f">渲染器</text>
  <text x="600" y="170" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">计算每个像素的颜色</text>

  <line x1="765" y1="145" x2="885" y2="145" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="825" y="125" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#475569">PutPixel</text>

  <rect x="895" y="70" width="250" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1020" y="125" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#14532d">二维画布</text>
  <text x="1020" y="170" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#334155">最终像素图像</text>

  <text x="600" y="268" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">渲染 = 建立三维场景与二维像素之间的映射</text>
</svg>
