<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1100" height="660" fill="#ffffff"/>
  <text x="45" y="48" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#17202a">镜面反射公式的推理过程</text>
  <text x="45" y="80" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b76">约定：L、N、R、V 都从交点 P 出发，并且参与点积前先归一化</text>

  <rect x="45" y="112" width="450" height="420" rx="6" fill="#f7f9fb" stroke="#cbd3db"/>
  <text x="70" y="148" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#17202a">交点处的几何关系</text>
  <line x1="85" y1="410" x2="455" y2="410" stroke="#6b7280" stroke-width="5"/>
  <text x="92" y="438" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5f6b76">表面切线方向</text>
  <circle cx="270" cy="410" r="8" fill="#17202a"/>
  <text x="253" y="448" font-family="Consolas, monospace" font-size="21" font-weight="700" fill="#17202a">P</text>

  <line x1="270" y1="400" x2="270" y2="195" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="286" y="212" font-family="Consolas, monospace" font-size="21" font-weight="700" fill="#2563eb">N</text>
  <text x="305" y="212" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#2563eb">法线</text>

  <line x1="115" y1="205" x2="263" y2="402" stroke="#15803d" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/>
  <text x="78" y="190" font-family="Consolas, monospace" font-size="21" font-weight="700" fill="#15803d">L</text>
  <text x="101" y="190" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#15803d">P→光源</text>
  <text x="93" y="245" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6b7280">真实入射方向是 -L</text>

  <line x1="277" y1="402" x2="425" y2="205" stroke="#dc2626" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="390" y="180" font-family="Consolas, monospace" font-size="21" font-weight="700" fill="#dc2626">R</text>
  <text x="414" y="180" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#dc2626">反射方向</text>

  <line x1="278" y1="403" x2="412" y2="330" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-violet)"/>
  <text x="390" y="338" font-family="Consolas, monospace" font-size="21" font-weight="700" fill="#7c3aed">V</text>
  <text x="414" y="338" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7c3aed">P→相机</text>

  <path d="M250 345 A68 68 0 0 1 311 350" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <text x="278" y="365" font-family="Consolas, monospace" font-size="17" fill="#6b7280">入射角 = 反射角</text>

  <rect x="525" y="112" width="530" height="420" rx="6" fill="#fffaf3" stroke="#e6c48a"/>
  <text x="550" y="148" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#7c4a03">从 -L 推到 R</text>

  <rect x="550" y="170" width="480" height="70" rx="4" fill="#eef6ff" stroke="#9fc4ee"/>
  <text x="570" y="198" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#1e4f85">1. 入射方向：光从光源走向 P</text>
  <text x="570" y="224" font-family="Consolas, monospace" font-size="20" fill="#17202a">d = -L</text>

  <rect x="550" y="255" width="480" height="95" rx="4" fill="#f0fdf4" stroke="#a7d7b2"/>
  <text x="570" y="283" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#166534">2. 把 L 分成法向分量和切向分量</text>
  <text x="570" y="312" font-family="Consolas, monospace" font-size="20" fill="#17202a">a = N·L</text>
  <text x="715" y="312" font-family="Consolas, monospace" font-size="20" fill="#17202a">T = L - aN</text>
  <text x="570" y="338" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#5f6b76">aN 沿法线，T 沿表面切线</text>

  <rect x="550" y="365" width="480" height="95" rx="4" fill="#fff4f3" stroke="#efb0aa"/>
  <text x="570" y="393" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#9f2d25">3. 反射规则：法向翻转，切向保持</text>
  <text x="570" y="423" font-family="Consolas, monospace" font-size="20" fill="#17202a">d = -aN - T  →  R = +aN - T</text>
  <text x="725" y="423" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#5f6b76">入射角等于反射角</text>

  <rect x="550" y="475" width="480" height="35" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="570" y="499" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#17202a">R = aN - T = 2N(N·L) - L</text>

  <rect x="45" y="560" width="1010" height="80" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="70" y="588" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#5b21b6">为什么再点 V？</text>
  <text x="70" y="616" font-family="Consolas, monospace" font-size="18" fill="#17202a">cosα = normalize(R)·normalize(V)  →  高光强度 ∝ max(0, cosα)^s</text>
  <text x="70" y="636" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#5b21b6">R 越对准 V 越亮；s 越大，高光越窄。</text>
</svg>
