<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">射线与球体的三种相交关系</title>
  <desc id="desc">判别式小于零时无交点，等于零时相切，大于零时有两个交点。</desc>
  <defs>
    <marker id="rayArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#f8fafc"/>

  <text x="200" y="48" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#0f172a">无交点</text>
  <circle cx="220" cy="235" r="88" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <line x1="55" y1="105" x2="345" y2="105" stroke="#334155" stroke-width="4" marker-end="url(#rayArrow)"/>
  <text x="200" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#b91c1c">Δ &lt; 0</text>

  <line x1="400" y1="70" x2="400" y2="405" stroke="#cbd5e1" stroke-width="2"/>

  <text x="600" y="48" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#0f172a">一个交点</text>
  <circle cx="620" cy="235" r="88" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <line x1="455" y1="147" x2="745" y2="147" stroke="#334155" stroke-width="4" marker-end="url(#rayArrow)"/>
  <circle cx="620" cy="147" r="8" fill="#dc2626"/>
  <text x="600" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#166534">Δ = 0</text>

  <line x1="800" y1="70" x2="800" y2="405" stroke="#cbd5e1" stroke-width="2"/>

  <text x="1000" y="48" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#0f172a">两个交点</text>
  <circle cx="1020" cy="235" r="88" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <line x1="855" y1="235" x2="1145" y2="235" stroke="#334155" stroke-width="4" marker-end="url(#rayArrow)"/>
  <circle cx="932" cy="235" r="8" fill="#dc2626"/>
  <circle cx="1108" cy="235" r="8" fill="#dc2626"/>
  <text x="932" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#991b1b">t2</text>
  <text x="1108" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#991b1b">t1</text>
  <text x="1000" y="382" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#92400e">Δ &gt; 0</text>

  <text x="600" y="443" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#0f172a">判别式决定相交次数；有效范围内最小的 t 决定可见表面</text>
</svg>
